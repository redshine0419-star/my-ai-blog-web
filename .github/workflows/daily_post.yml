name: AutoPress V8.1 Daily Post

on:
  schedule:
    - cron: '0 21 * * *' # 한국 시간 매일 오전 6시
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v3 -> v4 업데이트

      - name: Set up Python
        uses: actions/setup-python@v5 # v4 -> v5 업데이트
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests google-generativeai

      - name: Run automation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE1_URL: ${{ secrets.SITE1_URL }}
          SITE1_MEDIA: ${{ secrets.SITE1_MEDIA }}
          SITE1_USER: ${{ secrets.SITE1_USER }}
          SITE1_PASS: ${{ secrets.SITE1_PASS }}
          SITE2_URL: ${{ secrets.SITE2_URL }}
          SITE2_MEDIA: ${{ secrets.SITE2_MEDIA }}
          SITE2_USER: ${{ secrets.SITE2_USER }}
          SITE2_PASS: ${{ secrets.SITE2_PASS }}
          SITE3_URL: ${{ secrets.SITE3_URL }}
          SITE3_MEDIA: ${{ secrets.SITE3_MEDIA }}
          SITE3_USER: ${{ secrets.SITE3_USER }}
          SITE3_PASS: ${{ secrets.SITE3_PASS }}
        run: python auto_run.py
